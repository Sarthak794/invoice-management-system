<section>

<!-- ================= HEADER ================= -->
<div class="d-flex justify-content-between align-items-center mb-4">
    <h3>🧾 Invoice</h3>

    <div>
        <button class="btn btn-outline-secondary me-2"
                onclick="window.print()">
            🖨 Print
        </button>

        <a th:href="@{/invoice/list}"
           class="btn btn-secondary">
            Back
        </a>
    </div>
</div>

<!-- ================= INVOICE CARD ================= -->
<div class="card">
    <div class="card-body">

        <!-- HEADER INFO -->
        <div class="row mb-4">
            <div class="col-md-6">
                <h5>
                    Invoice #: <span th:text="${invoice.invoiceNumber}"></span>
                </h5>
                <p>Date:
                    <span th:text="${invoice.invoiceDate}"></span>
                </p>
                <p>Status:
                    <span class="badge bg-success"
                          th:if="${invoice.status == 'PAID'}">PAID</span>
                    <span class="badge bg-warning text-dark"
                          th:if="${invoice.status == 'PARTIAL'}">PARTIAL</span>
                    <span class="badge bg-danger"
                          th:if="${invoice.status == 'DUE'}">DUE</span>
                </p>
            </div>

            <div class="col-md-6 text-end">
                <h6>Customer</h6>
                <p class="mb-0" th:text="${invoice.customer.name}"></p>
                <small th:text="${invoice.customer.email}"></small>
            </div>
        </div>

        <!-- ================= ITEMS ================= -->
        <table class="table table-bordered">
            <thead class="table-light">
                <tr>
                    <th>#</th>
                    <th>Product</th>
                    <th class="text-end">Price</th>
                    <th class="text-center">Qty</th>
                    <th class="text-end">Total</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item, i : ${invoice.items}">
                    <td th:text="${i.index + 1}"></td>
                    <td th:text="${item.product.name}"></td>
                    <td class="text-end">
                        ₹ <span th:text="${item.price}"></span>
                    </td>
                    <td class="text-center"
                        th:text="${item.quantity}"></td>
                    <td class="text-end">
                        ₹ <span th:text="${item.total}"></span>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- ================= TOTALS ================= -->
        <div class="row justify-content-end">
            <div class="col-md-4">
                <table class="table">
                    <tr>
                        <th>Subtotal</th>
                        <td class="text-end">
                            ₹ <span th:text="${invoice.subtotal}"></span>
                        </td>
                    </tr>
                    <tr>
                        <th>Discount</th>
                        <td class="text-end">
                            ₹ <span th:text="${invoice.discount}"></span>
                        </td>
                    </tr>
                    <tr class="fw-bold">
                        <th>Grand Total</th>
                        <td class="text-end">
                            ₹ <span th:text="${invoice.grandTotal}"></span>
                        </td>
                    </tr>
                </table>
            </div>
        </div>

        <!-- ================= ACTION PANEL ================= -->
        <div class="mt-4">
            <div class="card">
                <div class="card-body">

                    <div class="row align-items-end g-3">

                        <!-- ADD PAYMENT -->
                        <form th:action="@{/invoice/payment/add}"
                              method="post"
                              class="col-md-7 row g-2">

                            <input type="hidden"
                                   name="invoiceId"
                                   th:value="${invoice.id}">

                            <div class="col-md-4">
                                <input type="number"
                                       name="amount"
                                       class="form-control"
                                       placeholder="Payment Amount"
                                       required>
                            </div>

                            <div class="col-md-4">
                                <select name="paymentMode"
                                        class="form-select">
                                    <option value="CASH">Cash</option>
                                    <option value="UPI">UPI</option>
                                    <option value="CARD">Card</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <button class="btn btn-success w-100">
                                    ➕ Add Payment
                                </button>
                            </div>
                        </form>

                        <!-- SECONDARY ACTIONS -->
                        <div class="col-md-5 text-md-end">

                            <!-- MARK FULLY PAID -->
                            <form th:if="${invoice.status != 'PAID'}"
                                  th:action="@{/invoice/payment/clear}"
                                  method="post"
                                  class="d-inline">

                                <input type="hidden"
                                       name="invoiceId"
                                       th:value="${invoice.id}">

                                <button class="btn btn-outline-success me-2">
                                    ✔ Mark Fully Paid
                                </button>
                            </form>

                            <!-- PDF -->
                            <a th:href="@{/invoice/pdf/{id}(id=${invoice.id})}"
                               class="btn btn-outline-primary me-2">
                                📄 PDF
                            </a>

                            <!-- EMAIL -->
                            <a th:href="@{/invoice/email/{id}(id=${invoice.id})}"
                               class="btn btn-outline-secondary">
                                ✉ Email
                            </a>

                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>
</div>

</section>
