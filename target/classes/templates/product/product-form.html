<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="layout/base :: layout(~{::section})">

<section>

<h3 th:text="${product.id == null ? 'Add Product' : 'Edit Product'}"></h3>

<form th:action="@{/products/save}" th:object="${product}" method="post">

    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label>Name</label>
        <input type="text" th:field="*{name}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Price</label>
        <input type="number" th:field="*{price}" class="form-control" required>
    </div>

    <div class="mb-3">
        <label>Stock</label>
        <input type="number" th:field="*{stock}" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-success">Save</button>
    <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>

</form>

</section>
</html>
